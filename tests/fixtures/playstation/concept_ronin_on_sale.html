uctEdition","name":"Edição Padrão"},"name":"A ascensão do Ronin™","descriptions":[{"__typename":"Description","type":"SHORT","value":"FORJE O SEU DESTINO"},{"__typename":"Description","type":"LONG","value":"A edição inclui: <br/>A ascensão do Ronin, jogo completo para PS5®.<br/><br/>Japão, 1863. <br/>Após três séculos de tirania do xogunato Tokugawa, os navios negros do Ocidente avançam sobre as fronteiras japonesas, deixando o país em tumulto. Em meio ao caos da guerra, doenças e agitação política, um guerreiro anônimo forja seu próprio destino, e o que está em jogo é o futuro do próprio Japão.<br/><br/>Escreva uma história dinâmica<br/>Como um samurai sem mestre, um ronin, e tome o rumo que quiser. Veja a história se desenrolar de maneiras diferentes, dependendo das escolhas que fizer e dos personagens a que você se juntar no caminho. Encare decisões cruciais em suas missões, como a de assassinar ou proteger figuras-chave e, com isso, alterar o curso da história através de um sofisticado sistema de múltiplas possibilidades. <br/><br/>Entre em um combate imersivo e acessível<br/>Dos veteranos desenvolvedores de Nioh e Ninja Gaiden, A ascensão do Ronin oferece um combate altamente imersivo, mas ao mesmo tempo acessível, com diferentes camadas de complexidade adequadas a qualquer estilo de jogo. Enfrente seus inimigos com uma gama de armas de combate corpo a corpo ou ataque à distância usando armas de fogo autênticas da época.<br/><br/>Explore um mundo de ambientação histórica <br/>O período \"Bakumatsu\" antecede o fim do xogunato, quando uma nova era se inicia e o Oriente e o Ocidente se chocam. Vivencie essa revolução cultural em um mundo aberto no qual você conhecerá figuras importantes que determinarão o curso da história e cidadãos comuns procurando uma luz em meio à escuridão.<br/><br/>Sinta-se como se estivesse no Japão do século XIX graças aos recursos do console PlayStation®5.<br/>Perceba o impacto do combate através da resposta tátil do controle sem fio DualSense™.<br/>Experimente o clique do gatilho do seu fuzil de época e muito mais através dos gatilhos adaptáveis do controle sem fio DualSense.<br/>Ouça o mundo ao seu redor, do burburinho das ruas da capital aos sons idílicos da zona rural com o áudio espacial em 3D.*<br/>Não perca tempo e parta direto para a ação com a velocidade do console PlayStation®5. <br/>Explore uma recriação do Japão do século XIX lindamente renderizada e com detalhes de tirar o fôlego.<br/>*Áudio em 3D via alto-falantes integrados da TV ou fones de ouvido estéreo analógicos/USB.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","value":"PS Plus necessário para o jogo online<br/>Compatível com até 3 jogadores online com o PS Plus<br/>Jogo online opcional<br/>Compatível com função de vibração e efeito gatilho (controle sem fio DualSense)<br/>1 jogadores<br/>PS5 Pro Aprimorado<br/>Compatível com Uso remoto"},{"__typename":"Description","type":"LEGAL","value":"<br><br>É preciso ter uma conta para a PlayStation para usar os recursos online, que estão sujeitos aos termos de serviço e à política de privacidade aplicável (playstation.com/Terms e playstation.com/legal/privacy-policy).<br><br>Software sujeito à licença e à garantia limitada (us.playstation.com/softwarelicense/br).<br>"},{"__typename":"Description","type":"LEGAL","value":"<br>Você pode baixar esse conteúdo e reproduzi-lo no console PS5 principal associado à sua conta (pela configuração “Compartilhamento do console e Jogo offline”) e em outros consoles PS5 ao fazer login com essa conta.<br>"},{"__typename":"Description","type":"LEGAL","value":"<br/>© 2024 KOEI TECMO GAMES CO., LTD. Rise of the Ronin é uma marca comercial da KOEI TECMO GAMES CO., LTD. Publicado pela Sony Interactive Entertainment LLC.<br/>"}],"platforms":["PS5"],"publisherName":"Sony Interactive Entertainment","releaseDate":"2024-03-22T03:00:00Z","starRating":{"__typename":"StarRating","averageRating":4.06,"totalRatingsCount":31575},"storeDisplayClassifi Rise of the Ronin™","editionName":"Edição Padrão","helpfulCount":0,"isSpoiler":false,"isUserReported":false,"lastUpdated":"2026-08-25T14:37:56.000Z","rating":5,"title":"Ótimo jogo!","userVote":null},"ProductReviewTile:1202889844":{"id":"1202889844","__typename":"ProductReviewTile","author":{"__typename":"ProductReviewAuthor","avatar":{"__typename":"Media","url":"http://psn-rsc.prod.dl.playstation.net/psn-rsc/avatar/JP9000/PPSA21559_00-PREORDERAVATAR01_C931593F47B5D7394549_xl.png"},"isPsPlusSubscriber":true,"isOfficiallyVerified":false,"name":null,"onlineId":"MadeiraAlex"},"comment":"Excelente jogo! Você pode personalizar a aparência das lâminas gêmeas e realmente forjar o caminho da história.\nTodo o mapa é maravilhoso de explorar. Com o progresso do jogo, você consegue desbloquear uma maneira bem interessante de fazer travessias em certos trechos, o que torna a exploração ainda mais envolvente. Há vários minigames que são um ótimo extra, com destaque para o de encontrar e resgatar gatos no mapa.\nO sistema de combate é um dos focos do game e ele é sensacional também. Não chega a ser extremamente punitivo, mas exige certa habilidade, que você desenvolve com o tempo.\nHá também um sistema de laços bem interessante, no qual é possível fortalecer vínculos com certos personagens e interagir ainda mais com eles. Além disso, há a possibilidade de romance com vários personagens disponíveis.\nA ascensão do Ronin é claramente um jogo da Team Ninja, com uma excelência de combate e uma parceria fantástica com a Sony, que permitiu que esse projeto fosse extremamente ambicioso. É um jogo fantástico que recomendo totalmente!","productName":"Rise of the Ronin™","editionName":"Edição Padrão","helpfulCount":7,"isSpoiler":false,"isUserReported":false,"lastUpdated":"2025-10-11T21:57:49.000Z","rating":5,"title":"Recomendo totalmente!","userVote":null}},"translations":{"msgid_ratings_reviews":"Classificações e avaliações","msgid_variable_ratings":"%num% classificações","msgid_sr_average tform":"DWC","screenLanguages":[]},{"__typename":"ScreenLanguagesByPlatformElement","platform":"","screenLanguages":[]}],"platforms":["PS5"],"descriptions":[{"__typename":"Description","type":"SHORT","subType":"NONE","value":"FORJE O SEU DESTINO"},{"__typename":"Description","type":"LONG","subType":"NONE","value":"A edição inclui: <br/>A ascensão do Ronin, jogo completo para PS5®.<br/><br/>Japão, 1863. <br/>Após três séculos de tirania do xogunato Tokugawa, os navios negros do Ocidente avançam sobre as fronteiras japonesas, deixando o país em tumulto. Em meio ao caos da guerra, doenças e agitação política, um guerreiro anônimo forja seu próprio destino, e o que está em jogo é o futuro do próprio Japão.<br/><br/>Escreva uma história dinâmica<br/>Como um samurai sem mestre, um ronin, e tome o rumo que quiser. Veja a história se desenrolar de maneiras diferentes, dependendo das escolhas que fizer e dos personagens a que você se juntar no caminho. Encare decisões cruciais em suas missões, como a de assassinar ou proteger figuras-chave e, com isso, alterar o curso da história através de um sofisticado sistema de múltiplas possibilidades. <br/><br/>Entre em um combate imersivo e acessível<br/>Dos veteranos desenvolvedores de Nioh e Ninja Gaiden, A ascensão do Ronin oferece um combate altamente imersivo, mas ao mesmo tempo acessível, com diferentes camadas de complexidade adequadas a qualquer estilo de jogo. Enfrente seus inimigos com uma gama de armas de combate corpo a corpo ou ataque à distância usando armas de fogo autênticas da época.<br/><br/>Explore um mundo de ambientação histórica <br/>O período \"Bakumatsu\" antecede o fim do xogunato, quando uma nova era se inicia e o Oriente e o Ocidente se chocam. Vivencie essa revolução cultural em um mundo aberto no qual você conhecerá figuras importantes que determinarão o curso da história e cidadãos comuns procurando uma luz em meio à escuridão.<br/><br/>Sinta-se como se estivesse no Japão do século XIX graças aos recursos do console PlayStation®5.<br/>Perceba o impacto do combate através da resposta tátil do controle sem fio DualSense™.<br/>Experimente o clique do gatilho do seu fuzil de época e muito mais através dos gatilhos adaptáveis do controle sem fio DualSense.<br/>Ouça o mundo ao seu redor, do burburinho das ruas da capital aos sons idílicos da zona rural com o áudio espacial em 3D.*<br/>Não perca tempo e parta direto para a ação com a velocidade do console PlayStation®5. <br/>Explore uma recriação do Japão do século XIX lindamente renderizada e com detalhes de tirar o fôlego.<br/>*Áudio em 3D via alto-falantes integrados da TV ou fones de ouvido estéreo analógicos/USB.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","subType":"NONE","value":"PS Plus necessário para o jogo online<br/>Compatível com até 3 jogadores online com o PS Plus<br/>Jogo online opcional<br/>Compatível com função de vibração e efeito gatilho (controle sem fio DualSense)<br/>1 jogadores<br/>PS5 Pro Aprimorado<br/>Compatível com Uso remoto"},{"__typename":"Description","type":"LEGAL","subType":"SCEA_TOS","value":"<br><br>É preciso ter uma conta para a PlayStation para usar os recursos online, que estão sujeitos aos termos de serviço e à política de privacidade aplicável (playstation.com/Terms e playstation.com/legal/privacy-policy).<br><br>Software sujeito à licença e à garantia limitada (us.playstation.com/softwarelicense/br).<br>"},{"__typename":"Description","type":"LEGAL","subType":null,"value":"<br>Você pode baixar esse conteúdo e reproduzi-lo no console PS5 principal associado à sua conta (pela configuração “Compartilhamento do console e Jogo offline”) e em outros consoles PS5 ao fazer login com essa conta.<br>"},{"__typename":"Description","type":"LEGAL","subType":"PUBLISHER","value":"<br/>© 2024 KOEI TECMO GAMES CO., LTD. Rise of the Ronin é uma marca comercial da KOEI TECMO GAMES CO., LTD. Publicado pela Sony Interactive Entertainment LLC.<br/>"}],"type":"GAME"},"Concept:1000338
