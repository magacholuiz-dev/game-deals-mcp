<script id="env:0ffe3e70-b608-11f1-947c-956574a93ec5" type="application/json">{"args":{"productId":"EP1004-PPSA01547_00-GTAVISTANDARD001"},"overrides":{"showRatingInfo":true,"theme":"dark","locale":"pt-br"},"cache":{"Concept:10000730":{"id":"10000730","__typename":"Concept","ownedTitles":[]},"GameCTA:PREORDER:BUY_NOW:EP1004-PPSA01547_00-GTAVISTANDARD001-U001:OUTRIGHT":{"id":"PREORDER:BUY_NOW:EP1004-PPSA01547_00-GTAVISTANDARD001-U001:OUTRIGHT","__typename":"GameCTA","type":"PREORDER","action":{"__typename":"Action","type":"BUY_NOW","param":[{"__typename":"ActionParam","name":"skuId","value":"EP1004-PPSA01547_00-GTAVISTANDARD001-U001"},{"__typename":"ActionParam","name":"rewardId","value":"OUTRIGHT"},{"__typename":"ActionParam","name":"conceptId","value":"10000730"}]},"meta":{"__typename":"CTAMeta","preOrder":true}},"Product:EP1004-PPSA01547_00-GTAVISTANDARD001":{"id":"EP1004-PPSA01547_00-GTAVISTANDARD001","__typename":"Product","concept":{"__ref":"Concept:10000730"},"edition":{"__typename":"ProductEdition","name":"Standard Edition"},"name":"Grand Theft Auto VI","descriptions":[{"__typename":"Description","type":"SHORT","value":"Experiencie a maior e mais imersiva evolução da série GTA até o momento."},{"__typename":"Description","type":"LONG","value":"Compre o Grand Theft Auto VI na pré-venda e ganhe um mês de GTA+ no PlayStation 5 sem custos adicionais. A assinatura continua até ser cancelada. <br/><br/>A oferta termina em 19 de novembro de 2026.<br/><br/>Você receberá um e-mail de confirmação com instruções para resgate. Sua assinatura do GTA+ é intransferível e só pode ser resgatada na conta usada na compra do jogo na pré-venda. <br/><br/>Deve ser resgatado até 31 de março de 2027.<br/><br/>Compre antes de 23:59:59 de 19 de novembro de 2026 para receber: <br/><br/>- O Pacote Vintage Vice City <br/>- Um mês de GTA+ <br/><br/>Receba um mês de GTA+ com a sua reserva; deve ser resgatado até 23:59:59 de 31 de março de 2027. Após o mês, as afiliações são renovadas automaticamente todo mês pelo preço fixo mensal até o cancelamento. Cancele a qualquer momento. Limite de um resgate por conta, independente de compras adicionais. Consulte as Perguntas Frequentes do Resgate do GTA+ https://www.playstation.com/support/games/gta-vi-offer-terms/ para ver instruções de resgate e datas de término.<br/><br/><br/>Grand Theft Auto VI é uma experiência para um jogador.<br/><br/>Vice City, EUA.<br/>Jason e Lucia sempre souberam que tudo estava contra eles. Mas, depois que um serviço simples dá errado, eles vão parar no lado mais sombrio do lugar mais ensolarado dos Estados Unidos, em meio a uma conspiração criminosa se estendendo por todo o estado de Leonida – e são forçados a depender um do outro mais do que nunca para saírem dessa vivos.<br/>"},{"__typename":"Description","type":"COMPATIBILITY_NOTICE","value":"Compras no jogo opcionais<br/>Somente para jogo offline<br/>Compatível com função de vibração e efeito gatilho (controle sem fio DualSense)<br/>1 jogadores<br/>PS5 Pro Aprimorado<br/>Compatível com Uso remoto"},{"__typename":"Description","type":"LEGAL","value":"<br><br>É preciso ter uma conta para a PlayStation para usar os recursos online, que estão sujeitos aos termos de serviço e à política de privacidade aplicável (playstation.com/Terms e playstation.com/legal/privacy-policy).<br><br>Software sujeito à licença e à garantia limitada (us.playstation.com/softwarelicense/br).<br>"},{"__typename":"Description","type":"LEGAL","value":"<br>Você pode baixar esse conteúdo e reproduzi-lo no console PS5 principal associado à sua conta (pela configuração “Compartilhamento do console e Jogo offline”) e em outros consoles PS5 ao fazer login com essa conta.<br>"},{"__typename":"Description","type":"LEGAL","value":"<br/>A compra garante uma licença para o produto digital, sujeita aos Termos de Serviço (“TOS”) e à Política de Privacidade disponíveis no jogo e em www.rockstargames.com/br/legal e www.rockstargames.com/br/privacy. Certos recursos, conteúdos, serviços ou funções do jogo podem requerer conexão com a internet, registro em uma conta da Rockstar Games (idade mínima varia), um código de série de uso único, tarifas adicionais ou desbloqueio ao jogar; podem não ficar disponíveis para todos os jogadores ou a todo momento; e podem ser encerrados, modificados ou oferecidos sob termos diferentes de acordo com os Termos de Serviço. Violar os Termos de Serviço pode acarretar a restrição ou a revogação do acesso ao jogo ou à conta online. Este jogo é fictício; qualquer semelhança com lugares, pessoas ou entidades reais é mera coincidência, e não significa qualquer patrocínio ou parceria com terceiros no que diz respeito a conteúdos do jogo. A Rockstar Games não apoia ou tolera a prática de nenhuma conduta retratada neste jogo.<br/><br/>© 1997–2026. Rockstar Games Inc. Rockstar Games, Grand Theft Auto, Grand Theft Auto VI, VI, Vice City, R*, e logotipos relacionados são marcas comerciais da Take-Two Interactive Software, Inc. Todas as demais marcas e marcas comerciais são propriedades dos respectivos donos. Todos os direitos reservados.<br/>"}],"platforms":["PS5"],"publisherName":"Rockstar Games","releaseDate":"2026-11-19T03:00:00Z","starRating":{"__typename":"StarRating","averageRating":0,"totalRatingsCount":0},"storeDisplayClassification":"GAME_BUNDLE","compatibilityNoticesByPlatform":{"__typename":"CompatibilityNotices","PS5":[{"__typename":"CompatibilityNotice","type":"PS5_VIBRATION","value":"OPTIONAL"},{"__typename":"CompatibilityNotice","type":"PS5_TRIGGER_EFFECT","value":"OPTIONAL"},{"__typename":"CompatibilityNotice","type":"GRAPHICS_ENHANCED","value":"true"}],"PS4":null},"topCategory":"GAME","webctas":[{"__ref":"GameCTA:PREORDER:BUY_NOW:EP1004-PPSA01547_00-GTAVISTANDARD001-U001:OUTRIGHT"}]},"ROOT_QUERY":{"__typename":"Query","productRetrieve({\"productId\":\"EP1004-PPSA01547_00-GTAVISTANDARD001\"})":{"__ref":"Product:EP1004-PPSA01547_00-GTAVISTANDARD001"}}},"translations":{"msgid_time_separator":":","msg
