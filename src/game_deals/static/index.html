<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Deals</title>
<style>
  :root{
    --bg:#0a0c10; --card:#13171d; --card2:#171c23; --line:#232b35;
    --tx:#e9eef4; --mut:#8a95a3; --dim:#5f6b7a;
    --gold:#f5c451; --emerald:#34d399; --sky:#60a5fa; --rose:#fb7185;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  header{position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);
    background:rgba(10,12,16,.82);border-bottom:1px solid var(--line)}
  .hwrap{max-width:1280px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
  h1 span{color:var(--dim);font-weight:450}
  .grow{flex:1}
  .stamp{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  /* abaixo disto o carimbo de hora e o primeiro a sair: o seletor de ordem e o
     botao de atualizar precisam continuar na mesma linha do titulo */
  @media (max-width:900px){ .stamp{display:none} }
  @media (max-width:620px){ h1 span{display:none} .seg button{padding:5px 9px} }
  button{font:inherit;font-size:13.5px;font-weight:550;color:var(--tx);
    background:var(--card2);border:1px solid var(--line);border-radius:8px;
    padding:7px 14px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){background:#1f262f;border-color:#33404e}
  button:disabled{opacity:.5;cursor:progress}

  main{max-width:1280px;margin:0 auto;padding:24px}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(325px,1fr))}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:.18s}
  .card:hover{border-color:#313c4a;transform:translateY(-2px)}
  .card.hl-historico{border-color:rgba(245,196,81,.45)}
  .card.hl-destaque{border-color:rgba(52,211,153,.4)}

  .art{position:relative;aspect-ratio:16/9;overflow:hidden;
    background:linear-gradient(135deg,#151b23,#0f1319 60%)}
  .art img{width:100%;height:100%;object-fit:cover;display:block}
  .art .ph{width:100%;height:100%;display:grid;place-items:center;
    color:#2c3742;font-size:40px}
  .art::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(19,23,29,.95) 2%,transparent 55%)}

  .badge{position:absolute;top:10px;left:10px;z-index:2;display:flex;
    flex-direction:column;gap:1px;padding:6px 11px;border-radius:8px;
    font-size:10.5px;font-weight:750;letter-spacing:.07em;
    box-shadow:0 2px 10px rgba(0,0,0,.45)}
  .badge small{font-size:10px;font-weight:550;letter-spacing:.01em;opacity:.82;
    text-transform:none}
  .b-historico{background:linear-gradient(135deg,#f5c451,#e0a326);color:#3a2a00}
  .b-destaque{background:linear-gradient(135deg,#34d399,#0fa77a);color:#04291d}
  .b-bom{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#04203f}

  .compat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;
    font-weight:650;padding:3px 8px;border-radius:5px;letter-spacing:.02em;
    align-self:flex-start}
  .c-switch2_nativo{background:rgba(226,49,49,.16);color:#ff7b7b}
  .c-switch2_edition{background:rgba(167,139,250,.16);color:#c4b5fd}
  .c-switch1_retrocompativel{background:rgba(96,165,250,.14);color:#93c5fd}

  .plat{position:absolute;top:10px;right:10px;z-index:2;padding:4px 9px;
    border-radius:6px;background:rgba(10,12,16,.78);border:1px solid #2b3542;
    font-size:10.5px;font-weight:600;color:var(--mut);letter-spacing:.03em}

  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;flex:1}
  .title{font-size:15.5px;font-weight:620;line-height:1.32;letter-spacing:-.01em}

  .prow{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .price{font-size:26px;font-weight:700;letter-spacing:-.025em;
    font-variant-numeric:tabular-nums}
  .was{color:var(--dim);text-decoration:line-through;font-size:13px}
  .off{background:rgba(251,113,133,.14);color:var(--rose);border-radius:5px;
    padding:2px 7px;font-size:11.5px;font-weight:700}

  .verdict{font-size:12.5px;color:var(--mut);display:flex;gap:6px;
    align-items:flex-start;line-height:1.45}
  .verdict.good{color:var(--emerald)}
  .verdict.warn{color:#d99a4e}
  .dot{width:5px;height:5px;border-radius:50%;background:currentColor;
    flex:none;margin-top:6px;opacity:.75}

  .spark{background:var(--card2);border:1px solid var(--line);border-radius:9px;
    padding:10px 11px 8px}
  .spark .lbl{display:flex;justify-content:space-between;font-size:10.5px;
    color:var(--dim);margin-bottom:5px;font-variant-numeric:tabular-nums}
  .spark svg{display:block;width:100%;height:44px;overflow:visible}
  .spark .none{font-size:11.5px;color:var(--dim);text-align:center;padding:12px 0}

  .stores{border-top:1px solid var(--line);margin-top:auto;padding-top:10px;
    display:flex;flex-direction:column;gap:6px}
  .store{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .store .nm{color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .store .pr{font-variant-numeric:tabular-nums;font-weight:600}
  .store .mini{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;
    letter-spacing:.04em}
  .store.out .pr,.store.out .nm{opacity:.42}

  .comu{border-top:1px dashed var(--line);padding-top:9px;margin-top:2px;
    display:flex;flex-direction:column;gap:5px}
  .comu .hd{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim);
    display:flex;align-items:center;gap:6px}
  .comu .hd::after{content:"";flex:1;height:1px;background:var(--line)}
  .comu a{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
  .comu a:hover{color:var(--tx)}
  .comu .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .comu .nm b{color:var(--tx);font-weight:600}
  .comu .pr{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tx)}

  .hist{border-top:1px dashed var(--line);padding-top:9px;display:flex;
    flex-direction:column;gap:5px;opacity:.72}
  .hist .hd{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim)}
  .hist a{display:flex;gap:8px;font-size:12px;color:var(--mut);align-items:center}
  .hist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist .pr{font-variant-numeric:tabular-nums}
  .hist .dt{font-size:10.5px;color:var(--dim)}

  .meta{display:flex;justify-content:space-between;font-size:11px;
    color:var(--dim);padding-top:2px}

  .score{position:absolute;bottom:10px;right:10px;z-index:2;display:flex;
    align-items:center;gap:7px}
  .mc{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;
    font-size:15px;font-weight:750;color:#04140d;
    box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .mc.hi{background:#6dc849} .mc.mid{background:#fbc02d} .mc.lo{background:#f26c4f}
  .pop{background:rgba(10,12,16,.8);border:1px solid #2b3542;border-radius:6px;
    padding:3px 8px;font-size:10.5px;color:var(--mut);font-weight:600;
    font-variant-numeric:tabular-nums}

  .seg{display:flex;background:var(--card2);border:1px solid var(--line);
    border-radius:8px;padding:2px;gap:2px}
  .seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;
    color:var(--mut);border-radius:6px}
  .seg button.on{background:#28313c;color:var(--tx)}
  .seg button:hover:not(.on){background:#1c232b}

  .relev{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
  .bar{flex:1;height:3px;background:#222a34;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa)}

  .empty{text-align:center;padding:80px 20px;color:var(--mut)}
  .empty h2{font-size:17px;font-weight:600;color:var(--tx);margin:0 0 8px}
  .empty code{background:var(--card2);border:1px solid var(--line);
    padding:2px 7px;border-radius:5px;font-size:12.5px;color:var(--sky)}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>Game Deals <span id="count"></span></h1>
  <div class="grow"></div>
  <div class="seg" id="seg">
    <button data-sort="relevancia" class="on">Relevância</button>
    <button data-sort="destaques">Oportunidades</button>
  </div>
  <div class="stamp" id="stamp"></div>
  <button id="refresh">Atualizar preços</button>
</div></header>

<main><div class="grid" id="grid"></div></main>

<script>
const BRL = c => "R$ " + (c/100).toFixed(2).replace(".", ",");
const esc = s => String(s ?? "").replace(/[&<>"]/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmtPop = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1)
  .replace(".", ",") + "k" : String(n);
let ordem = "relevancia";

function sparkline(pts){
  if (!pts || pts.length < 2)
    return `<div class="spark"><div class="none">
      histórico insuficiente — a linha aparece após alguns dias de coleta</div></div>`;

  const W = 300, H = 44;
  const vals = pts.map(p => p.preco_cents);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const x = i => (i / (pts.length - 1)) * W;
  const y = v => H - ((v - lo) / span) * H;

  const line = pts.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.preco_cents).toFixed(1)}`).join("");
  const area = `${line}L${W},${H}L0,${H}Z`;
  const li = vals.indexOf(lo), last = pts.length - 1;
  const id = "g" + Math.random().toString(36).slice(2,8);

  // O mínimo da janela costuma ser MENOR que o preço de hoje mesmo em cards com
  // selo — porque o selo olha os últimos 90 dias e a linha, os últimos 12 meses.
  // Sem a data, isso lê como contradição; com ela, vira a explicação do selo.
  const [ay, am, ad] = pts[li].data.split("-");
  const quandoMin = `${ad}/${am}/${ay.slice(2)}`;

  return `<div class="spark">
    <div class="lbl"><span>12 meses · ${pts.length} leituras</span>
      <span>mín. ${BRL(lo)} em ${quandoMin}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#34d399" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${id})"/>
      <path d="${line}" fill="none" stroke="#34d399" stroke-width="1.6"
            stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${x(li).toFixed(1)}" cy="${y(lo).toFixed(1)}" r="2.6"
              fill="#f5c451" vector-effect="non-scaling-stroke"/>
      <circle cx="${x(last).toFixed(1)}" cy="${y(vals[last]).toFixed(1)}" r="2.6"
              fill="#e9eef4" vector-effect="non-scaling-stroke"/>
    </svg></div>`;
}

function card(p){
  const m = p.melhor;
  const sel = p.selo;
  const art = p.imagem
    ? `<img src="${esc(p.imagem)}" alt="" decoding="async"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),
           {className:'ph',textContent:'\\u{1F3AE}'}))">`
    : `<div class="ph">🎮</div>`;

  const badge = sel ? `<div class="badge b-${esc(sel.tier)}">${esc(sel.texto)}
      <small>${esc(sel.detalhe)}</small></div>` : "";

  let vcls = "", vtx = "sem leitura ainda";
  if (m){
    vtx = m.veredito;
    if (sel) vcls = "good";
    else if (/não é promoção|nao e promocao/i.test(m.veredito)) vcls = "warn";
  }

  const stores = (p.ofertas || []).map(o => `
    <div class="store ${o.em_estoque ? "" : "out"}">
      <span class="nm">${esc(o.loja)}</span>
      ${o.selo ? `<span class="mini b-${esc(o.selo.tier)}">${esc(o.selo.texto)}</span>` : ""}
      ${o.desconto_pct > 0 ? `<span class="off">-${o.desconto_pct}%</span>` : ""}
      <span class="pr">${esc(o.preco)}</span>
    </div>`).join("");

  const nota = p.nota
    ? `<div class="mc ${p.nota >= 80 ? "hi" : p.nota >= 60 ? "mid" : "lo"}"
         title="Metacritic ${p.nota}">${p.nota}</div>` : "";
  const pop = p.popularidade
    ? `<span class="pop">${fmtPop(p.popularidade)} jogadores</span>` : "";

  return `<article class="card ${sel ? "hl-" + esc(sel.tier) : ""}">
    <div class="art">${badge}
      ${p.plataforma ? `<div class="plat">${esc(p.plataforma.toUpperCase())}</div>` : ""}
      ${art}
      ${nota || pop ? `<div class="score">${pop}${nota}</div>` : ""}</div>
    <div class="body">
      <div class="title">${esc(p.titulo)}</div>
      ${p.compat ? `<span class="compat c-${esc(p.compat)}">${esc(p.compat_rotulo)}</span>` : ""}
      ${m ? `<div class="prow"><span class="price">${esc(m.preco)}</span>
        ${m.de && m.desconto_pct > 0 ? `<span class="was">${esc(m.de)}</span>
        <span class="off">-${m.desconto_pct}%</span>` : ""}</div>` : ""}
      <div class="verdict ${vcls}"><span class="dot"></span><span>${esc(vtx)}</span></div>
      ${sparkline(p.historico)}
      <div class="stores">${stores || '<div class="store"><span class="nm">nenhuma leitura</span></div>'}</div>
      ${p.relevancia != null ? `<div class="relev">
        <span>relevância ${p.relevancia}</span>
        <span class="bar"><i style="width:${Math.min(100, p.relevancia)}%"></i></span>
      </div>` : ""}
      ${(p.comunidade || []).length ? `<div class="comu">
        <div class="hd">OFERTAS DA COMUNIDADE</div>
        ${p.comunidade.map(c => `<a href="${esc(c.url)}" target="_blank" rel="noopener"
             title="${esc(c.titulo)}">
           <span class="nm"><b>${esc(c.loja)}</b> · ${esc(c.titulo)}</span>
           ${c.desconto_pct > 0 ? `<span class="off">-${c.desconto_pct}%</span>` : ""}
           <span class="pr">${esc(c.preco)}</span></a>`).join("")}
      </div>` : ""}
      ${(p.ja_esteve || []).length ? `<div class="hist">
        <div class="hd">JÁ ESTEVE POR (ofertas encerradas)</div>
        ${p.ja_esteve.map(h => `<a href="${esc(h.url)}" target="_blank" rel="noopener"
             title="${esc(h.titulo)}">
           <span class="nm">${esc(h.loja)}</span>
           <span class="dt">${esc(h.quando)}</span>
           <span class="pr">${esc(h.preco)}</span></a>`).join("")}
      </div>` : ""}
      <div class="meta"><span>${p.leituras} leituras</span>
        <span>${m ? "mín. hist. " + esc(m.minimo_historico) : ""}</span></div>
    </div></article>`;
}

async function load(){
  const r = await fetch("/api/cards?sort=" + ordem);
  const d = await r.json();
  document.getElementById("stamp").textContent = d.gerado_em;
  document.getElementById("count").textContent =
    d.produtos.length ? `· ${d.produtos.length} rastreados` : "";
  const g = document.getElementById("grid");
  if (!d.produtos.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h2>Nenhum produto rastreado ainda</h2>
      <p>Use <code>register_product</code> pelo Claude, ou rode
         <code>game-deals-collect</code>.</p></div>`;
    return;
  }
  g.innerHTML = d.produtos.map(card).join("");
}

document.getElementById("seg").onclick = e => {
  const b = e.target.closest("button[data-sort]");
  if (!b || b.classList.contains("on")) return;
  document.querySelectorAll("#seg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  ordem = b.dataset.sort;
  load();
};

document.getElementById("refresh").onclick = async e => {
  const b = e.target; b.disabled = true; b.textContent = "Buscando…";
  try { await fetch("/api/refresh", {method:"POST"}); await load(); }
  finally { b.disabled = false; b.textContent = "Atualizar preços"; }
};

load();
</script>
</body>
</html>
